name: ci

on:
  push:
    paths:
      - "**.go"
      - "go.mod"
      - "frontend/**"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "frontend/**"

jobs:
  go:
    name: Go (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # go test is hermetic: the test files are pure (parser/graphd/ci/
      # risk) and never start a runner or open a network connection.
      # DTM_DISABLE_DOCKER_PROBE is set defensively in case a future test
      # touches runner.New.
      - name: Build
        working-directory: .
        run: go build ./...

      - name: Vet
        working-directory: .
        run: go vet ./...

      - name: Test
        working-directory: .
        run: DTM_DISABLE_DOCKER_PROBE=1 go test ./...

      # govulncheck scans the module's dependency graph against the Go
      # vulnerability database; a newly-introduced known-vulnerable
      # dependency fails this job.
      - name: govulncheck (Go dependency vulnerabilities)
        working-directory: .
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: frontend
        run: npm install

      # tsc -b typechecks both projects (app + vite.config.ts via
      # tsconfig.node.json); vite build produces dist/.
      - name: Build
        working-directory: frontend
        run: npm run build

      # npm audit scans the tree the job just installed (the `npm install`
      # step above) against the advisory database; --audit-level=high fails
      # on any high/critical finding.
      - name: npm audit (JS dependency vulnerabilities)
        working-directory: frontend
        run: npm audit --audit-level=high

      # NOTE: `npm run lint` is not run here — package.json defines the
      # script but no ESLint config or typescript-eslint deps are
      # committed, so it would fail. Add config + deps to re-enable.

  # gitleaks scans the full history for committed secrets. Runs in its own
  # lightweight job so a secret finding does not block the component jobs.
  secret-scan:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
