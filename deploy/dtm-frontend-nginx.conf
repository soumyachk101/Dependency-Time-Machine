# nginx site for the DTM operator workbench (used by frontend/Dockerfile).
#
# The workbench's API client (frontend/src/api/client.ts) fetches the API
# same-origin under /v1. We proxy /v1/ to the dtm-server container, and also
# accept /api/ as an alias (rewritten to /v1/) so a "reverse /api to the
# server" expectation from the deployment brief is honoured too.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: hash-routing works without rewrites, but fall back for direct
    # deep-links.
    location / {
        try_files $uri /index.html;
    }

    # Static asset cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API same-origin proxy. dtm-server is a compose service name.
    location /v1/ {
        proxy_pass http://dtm-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /api/ {
        rewrite ^/api(/.*)$ /v1$1 break;
        proxy_pass http://dtm-server:8080;
        proxy_set_header Host $host;
    }

    # LB probes (mirrors the server's own /healthz).
    location /healthz {
        proxy_pass http://dtm-server:8080;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
